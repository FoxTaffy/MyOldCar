<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b15" />
    <script>
      // Тема до первой отрисовки, чтобы не мигало: тёмная/светлая/как в системе.
      try {
        var t = (JSON.parse(localStorage.getItem('myoldcar.ui.v1') || '{}').theme) || 'dark'
        var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <title>MyOldCar — ВАЗ 2104</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
