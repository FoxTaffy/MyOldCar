name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK уже есть на раннере; принимаем лицензии и ставим платформу, нужную плагину.
      - name: Prepare Android SDK
        run: |
          set +o pipefail
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Папка android/ не хранится в репозитории — генерируем при сборке.
      - run: npx cap add android
      - run: npx cap sync android
      - name: Foreground-сервис (постоянное уведомление)
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyOldCar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
